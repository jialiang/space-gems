<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Space Gems</title>
    <meta name="description" content="A tile-matching game made in React the React way." />
    <meta name="author" content="Jia Liang, hojialiang@yahoo.com" />

    <% for (const file in compilation.assets) if (file.endsWith(".woff2")) { %>
    <link
      rel="preload"
      href="<%= htmlWebpackPlugin.files.publicPath + file %>"
      as="font"
      type="font/woff2"
      crossorigin />
    <% } %>

    <link rel="icon" type="image/x-icon" href="https://jialiang.github.io/favicon.png" />
    <link rel="canonical" href="https://jialiang.github.io/space-gems/" />

    <% preact.headEnd %>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <% preact.bodyEnd %>
  </body>
</html>
